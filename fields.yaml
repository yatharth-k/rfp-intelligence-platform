# Service 01: Field Specifications
# Defines the fields extraction agents should pull from RFP documents.
# Each field has a name, description, expected types, format patterns,
# and acceptable 'not found' wording.

due_date:
  name: due_date
  description: Submission deadline for bid proposals
  doc_types: [rfp, addendum]
  required: true
  value_type: date
  format_pattern: "^\\d{1,2}[-/]\\d{1,2}[-/]\\d{4}$|^(January|February|March|April|May|June|July|August|September|October|November|December)\\s+\\d{1,2},?\\s+\\d{4}$"
  soft: false
  not_found_wording: ["not specified", "tbd", "to be determined", "open"]
  evidence_required: 2

contract_price:
  name: contract_price
  description: Total contract value or bid price
  doc_types: [rfp, addendum]
  required: true
  value_type: currency
  format_pattern: " ^\\$?[0-9]{1,3}(,[0-9]{3})*(\\.[0-9]{2})?$"
  soft: false
  not_found_wording: ["not disclosed", "pricing on request", "contact sales"]
  evidence_required: 2

contract_term:
  name: contract_term
  description: Duration of the contract or project timeline
  doc_types: [rfp, addendum]
  required: false
  value_type: text
  format_pattern: null
  soft: true
  not_found_wording: ["not specified", "tbd", "to be determined"]
  evidence_required: 1

